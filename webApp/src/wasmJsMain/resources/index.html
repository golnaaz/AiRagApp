<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiRagApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<!--
  Hidden file input that FilePicker.wasmjs.kt clicks programmatically.
  Being pre-existing in the DOM (rather than dynamically created) makes
  input.click() more reliable across browsers.
-->
<input type="file" id="__kmpPdfInput" accept="application/pdf,.pdf" style="display:none">
<script src="webApp.js"></script>
</body>
</html>
